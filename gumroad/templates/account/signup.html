{% extends "base.html" %}

{% load i18n %}
{% load crispy_forms_tags %}

{% block head_title %}
  {% trans "Signup" %}
{% endblock head_title %}
{% block content %}
  <div class="max-w-md mx-auto my-12 bg-white border-4 border-black p-8 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
    <h1 class="text-3xl font-black italic mb-6">{% trans "Sign Up" %}</h1>
    <form class="signup"
          id="signup_form"
          method="post"
          action="{% url 'account_signup' %}">
      {% csrf_token %}
      {{ form|crispy }}
      {% if redirect_field_value %}
        <input type="hidden"
               name="{{ redirect_field_name }}"
               value="{{ redirect_field_value }}" />
      {% endif %}
      <button class="btn btn-primary w-full rounded-none border-2 border-black mt-4 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:shadow-none transition-all"
              type="submit">{% trans "Sign Up" %}</button>
    </form>
  </div>
{% endblock content %}
