{% extends "base.html" %}

{% load crispy_forms_tags %}
{% load tailwind_filters %}

{% block content %}
  <div class="max-w-md mx-auto my-12 bg-white border-4 border-black p-8 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
    <h1 class="text-3xl font-black italic mb-6">Update {{ object.name }}</h1>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-primary w-full rounded-none border-2 border-black mt-4 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:shadow-none transition-all"
              type="submit">Submit</button>
    </form>
    <a href="{{ object.get_delete_url }}"
       class="block mt-6 text-center bg-red-500 text-white border-2 border-black px-6 py-2 font-bold shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:shadow-none hover:translate-x-[2px] hover:translate-y-[2px] transition-all">
      Delete
    </a>
  </div>
{% endblock content %}
